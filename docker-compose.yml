services:
  mock-api:
    image: node:20-alpine
    working_dir: /data
    volumes:
      - ./data:/data
    command: npx json-server@0.17.4 --watch db.json --routes routes.json --port 5000 --host 0.0.0.0
    ports:
      - "5000:5000"
  
  frontend:
    build: .
    ports:
      - "3001:80"
    depends_on:
      - mock-api